name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # nécessaire uniquement pour commiter le formatage sur les branches de travail

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    name: Qualité et APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: set -o pipefail; flutter pub get 2>&1 | tee -a /tmp/build.log

      - name: Formatage automatique (branches de travail)
        if: github.ref != 'refs/heads/main'
        run: |
          set -o pipefail
          dart format . 2>&1 | tee -a /tmp/build.log
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -am "style: dart format"
            git push
          fi

      - name: Vérifier le formatage
        run: set -o pipefail; dart format --output=none --set-exit-if-changed . 2>&1 | tee -a /tmp/build.log

      - name: Analyse statique
        run: set -o pipefail; flutter analyze 2>&1 | tee -a /tmp/build.log

      - name: Tests
        run: set -o pipefail; flutter test 2>&1 | tee -a /tmp/build.log

      - name: Projet Android
        run: set -o pipefail; bash tool/android_setup.sh 2>&1 | tee -a /tmp/build.log

      - name: Build APK release
        run: set -o pipefail; flutter build apk --release 2>&1 | tee -a /tmp/build.log

      - name: Publier l’APK
        uses: actions/upload-artifact@v7
        with:
          name: pixelrebuild-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Journal d’erreur (branche ci-logs)
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          tail -n 300 /tmp/build.log > /tmp/LOG.txt || true
          git checkout --orphan ci-logs
          git rm -rf . -q || true
          cp /tmp/LOG.txt LOG.txt
          git add LOG.txt
          git commit -qm "journal du build ${GITHUB_RUN_ID}"
          git push -f origin ci-logs
