name: Android build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - name: Generate Android platform files when absent
        run: flutter create --platforms=android --project-name pixelrebuild_ai .
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pixelrebuild-ai-apks
          path: build/app/outputs/flutter-apk/*.apk
