name: pixelrebuild_ai
description: Agrandissement d’images local pour Android (Flutter), sans envoi de vos photos.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  file_picker: ^8.1.2
  flutter:
    sdk: flutter
  gal: ^2.3.0
  image: ^4.2.0
  path_provider: ^2.1.4
  share_plus: ^12.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
